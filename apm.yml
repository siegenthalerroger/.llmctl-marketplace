name: llmctl-marketplace
version: 0.1.0
description: Published plugin marketplace for the .llmctl agent steering collection.
author: siegenthalerroger
# Mirrors the split licence of .llmctl: CC-BY-SA-4.0 for the markdown/steering
# content, MIT for scripts and config. Full texts travel in each bundle's
# LICENSES/ directory; per-file exceptions and third-party attribution are
# enumerated in the generated THIRD-PARTY-NOTICES.md.
license: MIT AND CC-BY-SA-4.0

# This repository holds generated artifacts only. Nothing here is authored by
# hand except this file and the docs:
#
#   plugins/<name>-<version>/   packed plugin bundles, produced by
#                               `python scripts/pack-marketplace.py` in ../.llmctl
#   .claude-plugin/             marketplace.json for Claude Code / Desktop / Cowork
#   .agents/plugins/            marketplace.json for Codex
#
# The two marketplace.json files are regenerated by running `apm pack` here.
# `packages[].source` must point at a path that exists in THIS repository: a
# plugin host clones the repo and reads that path directly — it never runs
# `apm install`.

marketplace:
  description: ".llmctl — personal agent steering: coding, research, authoring, ops, and product."
  # `claude plugin validate` reads the marketplace description from
  # `metadata.description`, while APM emits the `description:` above at the top
  # level. APM passes this block through verbatim, so declaring it here satisfies
  # the validator without post-processing the generated manifest (TODO 6g).
  metadata:
    description: ".llmctl — personal agent steering: coding, research, authoring, ops, and product."
  owner:
    name: siegenthalerroger
    url: https://github.com/siegenthalerroger
  outputs:
    claude: {}
    codex: {}
  versioning:
    # Packages move independently: a change to `ops` should not bump `core`, or a
    # version number stops meaning anything. `scripts/release.py` in .llmctl
    # derives each bump from the conventional commits scoped to that package.
    strategy: per_package
  packages:
    - name: llmctl-core
      source: ./plugins/llmctl-core-0.3.1
      version: 0.3.1
      category: Development
      description: Core steering skills — research, troubleshooting, batch execution, and Mermaid diagramming.
    - name: llmctl-meta
      source: ./plugins/llmctl-meta-1.0.0
      version: 1.0.0
      category: Development
      description: Meta authoring skills for agents, skills, prompts, instructions, hooks, MCP, and plugins.
    - name: llmctl-workflow
      source: ./plugins/llmctl-workflow-0.2.1
      version: 0.2.1
      category: Development
      description: Code delivery steering — TDD, git worktrees, merge-conflict resolution, code-review reception, and lint pipelines.
    - name: llmctl-ops
      source: ./plugins/llmctl-ops-0.2.1
      version: 0.2.1
      category: DevOps
      description: Ops / infrastructure steering — Helm, Kubernetes, and OpenTofu/Terraform skills.
    - name: llmctl-product
      source: ./plugins/llmctl-product-0.2.1
      version: 0.2.1
      category: Product
      description: Product steering skills — Epic and Feature PRD authoring.
    - name: llmctl-design
      source: ./plugins/llmctl-design-0.1.0
      version: 0.1.0
      category: Design
      description: Design steering — direction-setting, colour, typography, and presentation.
