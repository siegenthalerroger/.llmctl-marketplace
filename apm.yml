# Generated by llmctl-pack-marketplace in .llmctl from apm.marketplace.yml in the
# workspace - do not edit here. Every file in this repository is generated
# output; the sources live in the steering repository.
name: llmctl-marketplace
version: 0.1.0
description: Published plugin marketplace for the .llmctl agent steering collection.
author: siegenthalerroger
license: MIT AND CC-BY-SA-4.0

marketplace:
  description: ".llmctl — personal agent steering: coding, research, authoring, ops, and product."
  # Duplicated: `claude plugin validate` reads `metadata.description`, while APM
  # emits the top-level `description:`.
  metadata:
    description: ".llmctl — personal agent steering: coding, research, authoring, ops, and product."
  owner:
    name: siegenthalerroger
    url: https://github.com/siegenthalerroger
  outputs:
    claude: {}
    codex: {}
  versioning:
    strategy: per_package
  # packages: generated by llmctl-pack-marketplace, one entry per packages/*/apm.yml
  # (its name, description and category).
  packages:
    - name: llmctl-baseline
      source: ./plugins/llmctl-baseline-2026.9.2
      version: 2026.9.2
      description: Baseline for efficient and effective AI agent usage. Encourage usage of sub-agents, adopt a more concise output style, and more. Comes with domain-neutral planning, exploration and execution agents, research, troubleshooting, and diagramming steering.
      category: Productivity
    - name: llmctl-design
      source: ./plugins/llmctl-design-2026.9.2
      version: 2026.9.2
      description: Collaborative design work; direction-setting, colour, typography and presentation skills, plus layout, identity and data-visualisation practice.
      category: Design
    - name: llmctl-ops
      source: ./plugins/llmctl-ops-2026.9.4
      version: 2026.9.4
      description: Confidently hand off infrastructure work. Helm, Kubernetes and OpenTofu/Terraform skills, path-scoped conventions, and cloud and IaC documentation connectors.
      category: DevOps
    - name: llmctl-product
      source: ./plugins/llmctl-product-2026.9.3
      version: 2026.9.3
      description: Epic and feature PRD authoring, plus product-manager and UX-expert agents. Very Barebones!
      category: Product
    - name: llmctl-python
      source: ./plugins/llmctl-python-2026.9.4
      version: 2026.9.4
      description: Ensure modern pythonic development with source-authoring standards, single-file script discipline, and modern uv, ruff and ty project tooling.
      category: Development
    - name: llmctl-travel
      source: ./plugins/llmctl-travel-2026.9.4
      version: 2026.9.4
      description: Take the busy-work out of travel planning. Destination timing checks against holidays and major events, entry requirements, itineraries, and flight, hotel, ferry and stay search connectors.
      category: Productivity
    - name: llmctl-workflow
      source: ./plugins/llmctl-workflow-2026.9.4
      version: 2026.9.4
      description: Consistent code delivery from AI agents. Test-driven development, git worktrees, merge-conflict resolution, receiving code review and lint pipelines, plus a code-reviewer agent.
      category: Development
